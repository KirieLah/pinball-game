<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Pinball</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #0b1016; overflow: hidden; }
  body { min-height: 100vh; min-height: 100dvh; }
  .game-shell { box-sizing: border-box; width: 100vw; height: 100vh; height: 100dvh; display: flex; justify-content: center; align-items: center; gap: 12px; padding: 8px; }
  canvas { display: block; flex: 0 1 auto; width: auto; height: min(800px, calc(100dvh - 16px)); max-width: calc(100vw - 300px); max-height: calc(100vh - 16px); max-height: calc(100dvh - 16px); aspect-ratio: 480 / 800; touch-action: none; }
  #game-panel { box-sizing: border-box; flex: 0 1 260px; width: 260px; max-height: calc(100dvh - 16px); overflow: auto; padding: 16px; border: 1px solid #31465f; border-radius: 10px; background: #111923; color: #e8eef5; font: 14px system-ui, sans-serif; }
  #game-panel h1 { margin: 0 0 8px; color: #ffd166; font-size: 24px; }
  #game-panel h2 { margin: 16px 0 8px; color: #9fb3c8; font-size: 14px; }
  #game-panel p { margin: 6px 0; color: #9fb3c8; }
  .panel-levels { display: grid; gap: 8px; margin: 14px 0; }
  .panel-level-button { box-sizing: border-box; width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid #6fa8ff; border-radius: 6px; background: #172433; color: #ffd166; font: inherit; font-weight: 700; text-align: left; touch-action: manipulation; }
  .panel-level-button:hover, .panel-level-button:focus-visible { background: #24384d; outline: 2px solid #ffd166; outline-offset: 2px; }
  .panel-level-button span { display: block; margin-top: 2px; color: #e8eef5; font-size: 12px; font-weight: 400; }
  .panel-score { margin: 12px 0; padding: 10px; border: 1px solid #46617f; border-radius: 6px; }
  .panel-score strong { color: #ffd166; }
  .panel-board { margin: 12px 0; }
  .panel-board h2 { margin-top: 10px; color: #ffd166; }
  .panel-board ol { margin: 0; padding-left: 26px; }
  .panel-board li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; color: #e8eef5; }
  .panel-board li span:last-child { color: #ffd166; font-variant-numeric: tabular-nums; }
  .game-shell.level-select canvas { display: none; }
  .game-shell.level-select #game-panel { flex: 0 1 940px; width: min(940px, calc(100vw - 16px)); max-height: calc(100dvh - 16px); }
  .game-shell.level-select #game-panel h1 { margin-bottom: 4px; }
  .game-shell.level-select #game-panel > p { margin: 0 0 10px; }
  .game-shell.level-select .panel-levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0; }
  .game-shell.level-select .panel-level-button { min-height: 72px; }
  .game-shell.level-select .panel-level-button span { color: #9fb3c8; }
  .game-shell.level-select .panel-level-button .level-high-score { overflow-wrap: anywhere; }
  .game-shell.in-game #game-panel .panel-board { margin-top: 8px; }
  .dialog-backdrop { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; overflow: auto; padding: 16px; background: rgba(3, 7, 12, 0.82); font: 16px system-ui, sans-serif; color: #e8eef5; }
  .dialog-backdrop[hidden] { display: none; }
  .score-dialog { box-sizing: border-box; width: min(100%, 360px); max-height: 100%; overflow: auto; padding: 24px; border: 2px solid #6fa8ff; border-radius: 12px; background: #111b26; }
  .score-dialog h1 { margin: 0 0 10px; color: #ffd166; font-size: 24px; }
  .score-dialog p { margin: 0 0 16px; line-height: 1.4; }
  .score-dialog label { display: block; margin-bottom: 6px; }
  .score-dialog input { box-sizing: border-box; width: 100%; margin-bottom: 14px; padding: 10px; border: 1px solid #6fa8ff; border-radius: 6px; background: #0b1016; color: #fff; font: inherit; }
  .score-dialog button { margin: 12px 8px 0 0; padding: 10px 14px; border: 0; border-radius: 6px; background: #ffd166; color: #111; font: inherit; font-weight: 700; }
  .score-dialog button:disabled { opacity: 0.5; }
  #submission-status { min-height: 1.4em; color: #9fb3c8; }
  @media (max-width: 600px) and (orientation: portrait) {
    .game-shell { flex-direction: column; gap: 8px; }
    canvas { flex: 0 1 auto; height: min(63dvh, calc((100vw - 16px) * 5 / 3)); max-width: calc(100vw - 16px); max-height: 63dvh; }
    #game-panel { flex: 1 1 auto; width: min(480px, calc(100vw - 16px)); max-height: 34dvh; min-height: 0; padding: 10px 14px; }
    #game-panel h1 { font-size: 20px; }
    #game-panel h2 { margin: 10px 0 5px; }
    .panel-levels { gap: 6px; margin: 8px 0; }
    .panel-level-button { padding: 7px 10px; }
    .panel-board { margin: 8px 0; }
    .game-shell.level-select #game-panel { width: min(100%, calc(100vw - 16px)); max-height: calc(100dvh - 16px); flex: 0 1 auto; }
    .game-shell.level-select .panel-levels { grid-template-columns: 1fr; gap: 6px; }
    .game-shell.level-select .panel-level-button { min-height: 0; padding: 8px 10px; }
    .game-shell.level-select .panel-level-button span { font-size: 11px; }
    .game-shell.in-game #game-panel { flex: 0 0 auto; max-height: 31dvh; }
    .game-shell.in-game #game-panel h1 { margin-bottom: 4px; font-size: 16px; }
    .game-shell.in-game #game-panel .panel-score { display: inline-block; margin: 3px 5px 3px 0; padding: 5px 8px; font-size: 11px; }
    .game-shell.in-game #game-panel .panel-board { margin: 4px 0 0; }
    .game-shell.in-game #game-panel .panel-board h2 { margin: 0 0 4px; }
  }
</style>
</head>
<body>
<main class="game-shell level-select">
<canvas id="c" width="480" height="800"></canvas>
<aside id="game-panel"></aside>
</main>
<div id="score-dialog" class="dialog-backdrop" hidden>
  <form id="score-form" class="score-dialog">
    <h1>New high score!</h1>
    <p id="qualifying-score"></p>
    <label for="player-name">Name (1-16 letters, numbers, spaces, _ or -)</label>
    <input id="player-name" name="name" maxlength="16" pattern="[A-Za-z0-9 _\-]{1,16}" autocomplete="nickname" required>
    <div id="turnstile-widget"></div>
    <p id="submission-status" role="status" aria-live="polite"></p>
    <button id="submit-score" type="submit" disabled>Submit score</button>
    <button id="skip-score" type="button">Not now</button>
  </form>
</div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script>
// ============================================================
// POCKET PINBALL - baseline version
// Sections: 1) setup  2) table layout  3) input  4) physics  5) game flow  6) drawing  7) main loop
// ============================================================

// ---------- 1) SETUP ----------
const W = 480, H = 800;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const LEADERBOARD_API = 'https://pinbal-score-api.eirik-halseth.workers.dev/api/scores';
const TURNSTILE_SITE_KEY = '0x4AAAAAAGTGlzjnKP75KS1H';

const GRAVITY = 600;        // pixels per second squared (try 600 for a floatier ball)
const MAX_SPEED = 1500;     // speed cap so the ball can't tunnel through walls
const SUBSTEPS = 8;         // physics steps per frame, more = more accurate
const LAUNCH_SPEED = 1250;  // how hard the plunger shoots the ball
const PLUNGER_GATE_Y = 200;

const ball = { x: 445, y: 750, vx: 0, vy: 0, r: 8 };

let state = 'title';        // 'title' | 'ready' | 'play' | 'over'
let level = 1;
let score = 0, balls = 3, best = 0, bonus = false;
const hit = new Set();      // which bumpers were hit since the last bonus
let leaderboards = { 1: [], 2: [], 3: [] };
let leaderboardStatus = 'loading';
let pendingSubmission = null;
let turnstileWidgetId = null;
let turnstileToken = '';
const gamePanel = document.getElementById('game-panel');
const gameShell = document.querySelector('.game-shell');

try { best = +localStorage.getItem('pocketPinballBest') || 0; } catch (e) {}

async function refreshLeaderboards() {
  leaderboardStatus = 'loading';
  try {
    const response = await fetch(LEADERBOARD_API);
    if (!response.ok) throw new Error('Leaderboard request failed (' + response.status + ')');
    const data = await response.json();
    for (const boardLevel of [1, 2, 3]) {
      const entries = data.scores?.[boardLevel];
      if (!Array.isArray(entries)) throw new Error('Leaderboard response was invalid');
      leaderboards[boardLevel] = entries.slice(0, 5).filter(entry =>
        typeof entry.name === 'string' && Number.isInteger(entry.score) && entry.score >= 0);
    }
    leaderboardStatus = 'ready';
    renderGamePanel();
    return true;
  } catch (error) {
    console.error('Unable to load leaderboards:', error);
    leaderboardStatus = 'error';
    renderGamePanel();
    return false;
  }
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  })[character]);
}

function renderLeaderboard(boardLevel) {
  const entries = leaderboards[boardLevel];
  let rows;
  if (leaderboardStatus !== 'ready') {
    rows = '<li>' + (leaderboardStatus === 'loading' ? 'Loading...' : 'Offline') + '</li>';
  } else if (entries.length === 0) {
    rows = '<li>No scores yet</li>';
  } else {
    rows = entries.map(entry =>
      '<li><span>' + escapeHtml(entry.name) + '</span><span>' + entry.score.toLocaleString() + '</span></li>',
    ).join('');
  }
  return '<section class="panel-board"><h2>Level ' + boardLevel + ' top 5</h2><ol>' + rows + '</ol></section>';
}

function renderGamePanel() {
  const selectingLevel = state === 'title' || state === 'over';
  gameShell.classList.toggle('level-select', selectingLevel);
  gameShell.classList.toggle('in-game', !selectingLevel);
  let content = '';
  if (selectingLevel) {
    content += '<h1>Pocket Pinball</h1><p>Choose a level to play.</p>';
    content += '<div class="panel-levels" aria-label="Choose a level">' +
      MENU_BUTTONS.map(button => {
        const entries = leaderboards[button.level];
        const topEntry = entries[0];
        const scoreLabel = leaderboardStatus !== 'ready'
          ? (leaderboardStatus === 'loading' ? 'Loading high score...' : 'High score unavailable')
          : topEntry === undefined
            ? 'No high score yet'
            : 'High score: ' + escapeHtml(topEntry.name) + ' · ' + topEntry.score.toLocaleString();
        return '<button class="panel-level-button" type="button" data-level="' + button.level + '"' +
          (state === 'over' ? ' disabled' : '') + '>' +
          'Play level ' + button.level + '<span class="level-high-score">' + bumperLayouts[button.level - 1].length +
          ' bumpers · ' + scoreLabel + '</span></button>';
      }).join('') + '</div>';
  } else {
    content += '<h1>Level ' + level + '</h1><div class="panel-score">Current score <strong>' +
      score.toLocaleString() + '</strong><br>Personal best <strong>' +
      best.toLocaleString() + '</strong></div>';
    if (state === 'ready') content += '<p>Press Space or tap the table to launch.</p>';
    content += renderLeaderboard(level);
  }
  gamePanel.innerHTML = content;
}

gamePanel.addEventListener('click', event => {
  const button = event.target.closest('button[data-level]');
  if (button && gamePanel.contains(button)) newGame(Number(button.dataset.level));
});

function qualifiesForLeaderboard(boardLevel, newScore) {
  const entries = leaderboards[boardLevel];
  return newScore > 0 && (entries.length < 5 || newScore > entries[entries.length - 1].score);
}

const scoreDialog = document.getElementById('score-dialog');
const scoreForm = document.getElementById('score-form');
const playerNameInput = document.getElementById('player-name');
const submitScoreButton = document.getElementById('submit-score');
const submissionStatus = document.getElementById('submission-status');
const turnstileScript = document.querySelector('script[src*="challenges.cloudflare.com/turnstile"]');

function renderTurnstileWidget() {
  if (scoreDialog.hidden) return;
  if (!window.turnstile) {
    submissionStatus.textContent = 'Verification could not load. Check your connection and try again.';
    return;
  }
  if (turnstileWidgetId !== null) {
    window.turnstile.reset(turnstileWidgetId);
    return;
  }
  turnstileWidgetId = window.turnstile.render('#turnstile-widget', {
    sitekey: TURNSTILE_SITE_KEY,
    action: 'score_submit',
    callback(token) {
      turnstileToken = token;
      submitScoreButton.disabled = false;
      submissionStatus.textContent = '';
    },
    'expired-callback'() {
      turnstileToken = '';
      submitScoreButton.disabled = true;
      submissionStatus.textContent = 'Verification expired. Please complete it again.';
    },
    'error-callback'() {
      turnstileToken = '';
      submitScoreButton.disabled = true;
      submissionStatus.textContent = 'Verification failed to load. Please try again.';
    },
  });
}

function closeScoreDialog() {
  scoreDialog.hidden = true;
  pendingSubmission = null;
  turnstileToken = '';
  submitScoreButton.disabled = true;
  if (turnstileWidgetId !== null && window.turnstile) window.turnstile.reset(turnstileWidgetId);
}

function returnToTitle() {
  closeScoreDialog();
  state = 'title';
  renderGamePanel();
}

function openScoreDialog(boardLevel, newScore) {
  pendingSubmission = { level: boardLevel, score: newScore };
  scoreDialog.hidden = false;
  playerNameInput.value = '';
  submissionStatus.textContent = 'Complete the human check to submit.';
  submitScoreButton.disabled = true;
  document.getElementById('qualifying-score').textContent =
    'Level ' + boardLevel + ' - ' + newScore + ' points';
  renderTurnstileWidget();
  playerNameInput.focus();
}

turnstileScript.addEventListener('load', renderTurnstileWidget);
document.getElementById('skip-score').addEventListener('click', returnToTitle);
scoreForm.addEventListener('submit', async event => {
  event.preventDefault();
  if (!pendingSubmission || !turnstileToken || !scoreForm.reportValidity()) return;

  submitScoreButton.disabled = true;
  submissionStatus.textContent = 'Submitting score...';
  try {
    const response = await fetch(LEADERBOARD_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ...pendingSubmission,
        name: playerNameInput.value.trim(),
        turnstileToken,
      }),
    });
    const data = await response.json();
    if (data.scores) {
      leaderboards = data.scores;
      leaderboardStatus = 'ready';
    }
    if (response.status === 201 && data.submitted) {
      returnToTitle();
      return;
    }
    submissionStatus.textContent = data.error || data.message || 'Score could not be submitted.';
  } catch (error) {
    console.error('Unable to submit score:', error);
    submissionStatus.textContent = 'Could not reach the leaderboard. Check your connection and try again.';
  }
  turnstileToken = '';
  if (turnstileWidgetId !== null && window.turnstile) window.turnstile.reset(turnstileWidgetId);
});

// ---------- 2) TABLE LAYOUT ----------
// Walls are line segments: [x1, y1, x2, y2]
const walls = [
  [20, 60, 20, 650],     // left wall
  [20, 60, 60, 10],      // top-left corner
  [60, 10, 390, 10],     // top wall
  [390, 10, 460, 90],    // top-right deflector (turns the launched ball into the table)
  [460, 90, 460, 770],   // right wall
  [430, 200, 430, 770],  // wall between the table and the plunger lane
  [430, 770, 460, 770],  // lane floor
  [20, 650, 130, 722],   // left slope down to the flipper
  [430, 650, 330, 722],  // right slope down to the flipper
];
const levelOneGuides = [
  [20, 480, 100, 540],
  [430, 480, 360, 540],
];
const raisedGuides = [
  [20, 430, 100, 490],
  [430, 430, 360, 490],
];

const bumpers = [
  { x: 240, y: 230, r: 28 },
  { x: 170, y: 340, r: 28 },
  { x: 310, y: 340, r: 28 },
];
const levelTwoBumpers = [
  ...bumpers,
  { x: 150, y: 565, r: 28 },
  { x: 330, y: 565, r: 28 },
];
const levelThreeBumpers = [
  { x: 160, y: 230, r: 28 },
  { x: 240, y: 185, r: 28 },
  { x: 320, y: 230, r: 28 },
  { x: 150, y: 565, r: 28 },
  { x: 330, y: 565, r: 28 },
];
const bumperLayouts = [bumpers, levelTwoBumpers, levelThreeBumpers];
const MENU_BUTTONS = [{ level: 1 }, { level: 2 }, { level: 3 }];

function currentBumpers() {
  return bumperLayouts[level - 1];
}

// Flippers: sg = +1 for left (points right), -1 for right (points left).
// angle 0.5 = resting (tip down), angle -0.5 = raised.
const REST = 0.5, UP = -0.5, FLIP_SPEED = 20, FLIP_LEN = 80;
const flippers = [
  { px: 130, py: 722, sg: 1,  side: 'L', a: REST, omega: 0 },
  { px: 330, py: 722, sg: -1, side: 'R', a: REST, omega: 0 },
  { px: 20, py: 430, sg: 1,  side: 'L', a: REST, omega: 0 },
  { px: 430, py: 430, sg: -1, side: 'R', a: REST, omega: 0 },
];

function currentFlippers() {
  return level === 3 ? flippers : flippers.slice(0, 2);
}

function currentWalls() {
  return [...walls, ...(level === 1 ? levelOneGuides : level === 2 ? raisedGuides : [])];
}

// ---------- 3) INPUT ----------
const keys = new Set();
const touches = new Map(); // pointerId -> 'L' or 'R'

function leftDown()  { return keys.has('ArrowLeft')  || keys.has('KeyZ') || [...touches.values()].includes('L'); }
function rightDown() { return keys.has('ArrowRight') || keys.has('KeyM') || [...touches.values()].includes('R'); }

window.addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code);
  if (state === 'title' && ['Digit1', 'Digit2', 'Digit3'].includes(e.code)) {
    newGame(Number(e.code.slice(-1)));
    return;
  }
  if (e.code === 'Space') action();
});
window.addEventListener('keyup', e => keys.delete(e.code));

window.addEventListener('pointerdown', e => {
  if (state === 'title' || state === 'over' || !scoreDialog.hidden) return;
  if (e.target.closest('button, input, textarea, select, a, [contenteditable="true"]')) return;
  touches.set(e.pointerId, e.clientX < window.innerWidth / 2 ? 'L' : 'R');
  action();
});
const endTouch = e => touches.delete(e.pointerId);
window.addEventListener('pointerup', endTouch);
window.addEventListener('pointercancel', endTouch);

// Space / tap launches the ball
function action() {
  if (state === 'ready') launch();
}

// ---------- 4) PHYSICS ----------
function closestPoint(ax, ay, bx, by, px, py) {
  const abx = bx - ax, aby = by - ay;
  let t = ((px - ax) * abx + (py - ay) * aby) / (abx * abx + aby * aby);
  t = Math.max(0, Math.min(1, t));
  return [ax + abx * t, ay + aby * t];
}

// Bounce the ball off a line segment. hw = half thickness, e = bounciness,
// surfaceVel = optional function giving the segment's own velocity (used by moving flippers).
function collideSegment(ax, ay, bx, by, hw, e, surfaceVel) {
  const [cx, cy] = closestPoint(ax, ay, bx, by, ball.x, ball.y);
  const dx = ball.x - cx, dy = ball.y - cy;
  const d = Math.hypot(dx, dy);
  const R = ball.r + hw;
  if (d >= R || d === 0) return;
  const nx = dx / d, ny = dy / d;
  ball.x = cx + nx * R;                  // push the ball out of the wall
  ball.y = cy + ny * R;
  const [sx, sy] = surfaceVel ? surfaceVel(cx, cy) : [0, 0];
  let rvx = ball.vx - sx, rvy = ball.vy - sy;
  const vn = rvx * nx + rvy * ny;
  if (vn < 0) {                          // only bounce if moving into the wall
    rvx -= (1 + e) * vn * nx;
    rvy -= (1 + e) * vn * ny;
    ball.vx = rvx + sx;
    ball.vy = rvy + sy;
  }
}

function flipperTip(f) {
  return [f.px + f.sg * FLIP_LEN * Math.cos(f.a), f.py + FLIP_LEN * Math.sin(f.a)];
}

function updateFlippers(dt) {
  currentFlippers().forEach(f => {
    const pressed = f.side === 'L' ? leftDown() : rightDown();
    const target = pressed ? UP : REST;
    const step = FLIP_SPEED * dt;
    if (Math.abs(target - f.a) <= step) { f.a = target; f.omega = 0; }
    else { const dir = Math.sign(target - f.a); f.a += dir * step; f.omega = dir * FLIP_SPEED; }
  });
}

function collideBumpers() {
  currentBumpers().forEach((b, i) => {
    const dx = ball.x - b.x, dy = ball.y - b.y;
    const d = Math.hypot(dx, dy);
    const R = ball.r + b.r;
    if (d >= R || d === 0) return;
    const nx = dx / d, ny = dy / d;
    ball.x = b.x + nx * R;
    ball.y = b.y + ny * R;
    const vn = ball.vx * nx + ball.vy * ny;
    if (vn < 0) { ball.vx -= 2 * vn * nx; ball.vy -= 2 * vn * ny; }
    // Give every bumper hit a kick so it feels bouncy
    const sp = Math.hypot(ball.vx, ball.vy);
    const kick = Math.max(sp, 450) / (sp || 1);
    ball.vx *= kick; ball.vy *= kick;
    scoreBumper(i);
  });
}

function scoreBumper(i) {
  if (bonus) {
    score += 500;
    bonus = false;
  } else {
    score += 100;
    hit.add(i);
    if (hit.size === currentBumpers().length) { bonus = true; hit.clear(); }
  }
  renderGamePanel();
}

function physicsStep(dt) {
  updateFlippers(dt);
  const previousX = ball.x, previousY = ball.y;
  ball.vy += GRAVITY * dt;
  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp > MAX_SPEED) { ball.vx *= MAX_SPEED / sp; ball.vy *= MAX_SPEED / sp; }
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  const gateContactY = PLUNGER_GATE_Y - ball.r;
  if (previousY < gateContactY && ball.y >= gateContactY && ball.vy > 0) {
    const crossingTime = (gateContactY - previousY) / (ball.y - previousY);
    const crossingX = previousX + (ball.x - previousX) * crossingTime;
    if (crossingX > 430 && crossingX < 460) {
      ball.y = gateContactY;
      ball.vy *= -0.5;
    }
  }

  for (const w of currentWalls()) collideSegment(w[0], w[1], w[2], w[3], 2, 0.5);
  for (const f of currentFlippers()) {
    const [tx, ty] = flipperTip(f);
    collideSegment(f.px, f.py, tx, ty, 7, 0.4, (cx, cy) => {
      const dx = cx - f.px, dy = cy - f.py;
      return [f.sg * f.omega * -dy, f.sg * f.omega * dx];
    });
  }
  collideBumpers();
}

// ---------- 5) GAME FLOW ----------
function resetBall() {
  ball.x = 445; ball.y = 750; ball.vx = 0; ball.vy = 0;
  state = 'ready';
  renderGamePanel();
}

function newGame(selectedLevel = level) {
  closeScoreDialog();
  level = selectedLevel;
  score = 0; balls = 3; bonus = false; hit.clear();
  resetBall();
}

function launch() {
  ball.vy = -LAUNCH_SPEED;
  state = 'play';
  renderGamePanel();
}

function ballLost() {
  balls--;
  bonus = false; hit.clear();
  if (balls <= 0) {
    state = 'over';
    if (score > best) {
      best = score;
      try { localStorage.setItem('pocketPinballBest', best); } catch (e) {}
    }
    renderGamePanel();
    const finishedLevel = level;
    const finishedScore = score;
    refreshLeaderboards().then(available => {
      if (state !== 'over' || level !== finishedLevel || score !== finishedScore) return;
      if (available && qualifiesForLeaderboard(finishedLevel, finishedScore)) {
        openScoreDialog(finishedLevel, finishedScore);
        return;
      }
      state = 'title';
      renderGamePanel();
    });
  } else {
    resetBall();
  }
}

function update(dt) {
  if (state === 'play') {
    for (let i = 0; i < SUBSTEPS; i++) physicsStep(dt / SUBSTEPS);
    // Ball fell back into the plunger lane and stopped: let the player launch again
    if (ball.x > 431 && ball.y > 600 && Math.hypot(ball.vx, ball.vy) < 40) resetBall();
    if (ball.y > H + 20) ballLost();
  } else {
    updateFlippers(dt); // flippers still move on the title and ready screens
  }
}

// ---------- 6) DRAWING ----------
function draw() {
  ctx.fillStyle = '#0b1016';
  ctx.fillRect(0, 0, W, H);

  // table walls
  ctx.strokeStyle = '#6fa8ff';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  for (const w of currentWalls()) { ctx.beginPath(); ctx.moveTo(w[0], w[1]); ctx.lineTo(w[2], w[3]); ctx.stroke(); }

  // bumpers (filled once hit toward a bonus)
  currentBumpers().forEach((b, i) => {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = bonus ? '#ffd166' : hit.has(i) ? '#ff8fab' : '#c9184a';
    ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
  });

  // flippers
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 14;
  for (const f of currentFlippers()) {
    const [tx, ty] = flipperTip(f);
    ctx.beginPath(); ctx.moveTo(f.px, f.py); ctx.lineTo(tx, ty); ctx.stroke();
  }

  // ball
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#fff'; ctx.fill();

  // HUD
  ctx.fillStyle = '#e8eef5';
  ctx.font = 'bold 18px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('BALLS ' + balls, 240, 48);
  ctx.textAlign = 'center'; ctx.fillStyle = '#9fb3c8'; ctx.font = 'bold 16px system-ui, sans-serif';
  ctx.fillText('LEVEL ' + level, 240, 78);

}

// ---------- 7) MAIN LOOP ----------
let last = performance.now();
renderGamePanel();
refreshLeaderboards();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30); // cap so a tab switch doesn't cause a huge jump
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
